<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Business Email</title>
    <style>

        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
        
        body { margin: 0; padding: 0; background-color: #f4f6f5; }
        .dark-img { display: none; display: none !important; } 
        

        a { text-decoration: none; color: inherit; }
        a:hover { text-decoration: none; }
        
        .text-link { color: #555555; text-decoration: none; }
        @media screen and (max-width: 600px) {
            .email-container { width: 100% !important; margin: 0 !important; border: 0 !important; }
            
            .outer-padding { padding: 0 !important; }
            .card-bg { box-shadow: none !important; background-color: #ffffff !important; }
            body, .body-bg { background-color: #ffffff !important; }
            .content-padding { padding: 40px 20px !important; }
            .info-table td { padding-bottom: 6px !important; } 
        }

        @media (prefers-color-scheme: dark) {
            body, .body-bg { background-color: #1a1a1a !important; }
            .card-bg { background-color: #262626 !important; color: #e0e0e0 !important; box-shadow: none !important; }
            h1, .text-primary { color: #ffffff !important; }
            .text-secondary { color: #bbbbbb !important; }
            td.text-label { color: #888888 !important; }
            td.text-value { color: #bbbbbb !important; }
            .text-link { color: #bbbbbb !important; text-decoration: none !important; }
            .divider-color { border-top: 1px solid #444444 !important; }
            .light-img { display: none !important; width: 0 !important; height: 0 !important; overflow: hidden !important; line-height: 0 !important; }
            .dark-img { display: block !important; width: auto !important; overflow: visible !important; float: none !important; max-height: inherit !important; line-height: auto !important; margin-top: 0px !important; visibility: visible !important; }
        }
    </style>
</head>
<body class="body-bg" style="margin: 0; padding: 0; background-color: #f4f6f5; font-family: Georgia, 'Times New Roman', 'KaiTi', serif;">

    <table class="body-bg" border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" style="background-color: #f4f6f5;">
        <tr>
            <td align="center" class="outer-padding" style="padding: 40px 10px; padding-bottom: 80px;">
                <table class="email-container card-bg" border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; max-width: 600px;">
                    <tr>
                        <td height="6" style="background-color: #2c5282;"></td>
                    </tr>
                    <tr>
                        <td class="content-padding card-bg" style="padding: 50px 60px 60px 60px; text-align: left; color: #4a4a4a;">

                            <h1 class="text-primary" style="margin: 0 0 25px 0; font-size: 22px; font-weight: normal; color: #333333; letter-spacing: 0.5px;">
                                Dear Partner,
                            </h1>
                            <div class="text-secondary" style="font-size: 15px; line-height: 1.8; color: #555555;">
                                <p style="margin-bottom: 20px;">
                                    很高兴就 [项目名称] 与您进行沟通。
                                </p>
                                <p style="margin-bottom: 20px;">
                                    附件中是我们要讨论的最新方案。我们对页面细节进行了微调，现在的排版更加简洁统一。
                                </p>
                                <p style="margin-bottom: 0;">
                                    祝商祺。
                                </p>
                            </div>
                            <div class="divider-color" style="margin: 50px 0 40px 0; border-top: 1px solid #eeeeee;"></div>
                            <div style="text-align: left;">
                                <div style="margin-bottom: 6px;">
                                    <a href="https://xiaofu.tech/" target="_blank" style="display: inline-block; width: 150px; text-decoration: none; border: 0;">
                                        <img src="https://wangyifang.com/share/img/Xiaofu-black.png" class="light-img" width="150" height="24" alt="Xiaofu Tech" style="display: block; border: 0; width: 150px; height: 24px; object-fit: contain;">
                                        <div class="dark-img" style="display:none; overflow:hidden; float:left; width:0px; max-height:0px; line-height:0px; visibility:hidden;">
                                             <img src="https://wangyifang.com/share/img/Xiaofu-white.png" width="150" height="24" alt="Xiaofu Tech" style="border:0; width: 150px; height: 24px; object-fit: contain;">
                                        </div>
                                    </a>
                                </div>
                                <div style="clear: both;"></div>
                                <p class="text-primary" style="margin: 0 0 24px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; color: #333333; letter-spacing: 1.3px; font-weight: bold;">
                                    杭州小肤科技有限公司
                                </p>
                                <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.6;">
                                    <div class="text-primary" style="margin: 0 0 12px 0; font-size: 16px; font-weight: bold; color: #333333;">
                                        王一方 <span style="font-weight: normal; font-size: 13px; color: #888;">Wang Yifang</span>
                                    </div>
                                    <table class="info-table" border="0" cellpadding="0" cellspacing="0" width="100%">
                                        <tr>
                                            <td class="text-label" valign="top" width="50" style="padding-bottom: 2px; color: #999999;">Email</td>
                                            <td valign="top" style="padding-bottom: 2px;">
                                                <a href="mailto:Wi-Fi@xiaofu.tech" class="text-link" style="color: #555555; text-decoration: none;">Wi-Fi@xiaofu.tech</a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="text-label" valign="top" width="50" style="padding-bottom: 2px; color: #999999;">Phone</td>
                                            <td class="text-value" valign="top" style="padding-bottom: 2px; color: #555555;">
                                                <a href="tel:+15074000571" class="text-link" style="color: #555555; text-decoration: none;">+1 507-400-0571</a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="text-label" valign="top" width="50" style="padding-bottom: 0; color: #999999;">Addr.</td>
                                            <td class="text-value" valign="top" style="padding-bottom: 0; color: #555555;">
                                                Huzhou City, Dream Town Entrepreneurial Avenue
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
