<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>404 | WANGYIFANG.COM</title>
    <script src="/analytics.js" defer></script>
    <style>
        :root {
            color-scheme: dark;
            --page-gutter: clamp(1rem, 4vw, 2rem);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            background: #121212;
        }

        body {
            min-width: 280px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            overflow-x: hidden;
            color: #dadada;
            background: #121212;
            font-family: Arial, Helvetica, sans-serif;
        }

        .error-page {
            position: relative;
            isolation: isolate;
            display: grid;
            grid-template-rows: auto minmax(1.5rem, 1fr) auto;
            gap: clamp(1rem, 4vh, 2rem);
            min-height: 100vh;
            min-height: 100svh;
            padding: var(--page-gutter);
            overflow: hidden;
        }

        @supports (height: 100dvh) {
            body,
            .error-page {
                min-height: 100dvh;
            }
        }

        @supports (padding: max(0px)) {
            .error-page {
                padding-top: max(var(--page-gutter), env(safe-area-inset-top));
                padding-right: max(var(--page-gutter), env(safe-area-inset-right));
                padding-bottom: max(var(--page-gutter), env(safe-area-inset-bottom));
                padding-left: max(var(--page-gutter), env(safe-area-inset-left));
            }
        }

        .home-link {
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-self: start;
            min-height: 44px;
            padding: 0.55rem 0.8rem;
            border: 2px solid #777;
            color: #999;
            font-size: clamp(0.75rem, 0.7rem + 0.2vw, 0.875rem);
            line-height: 1.2;
            text-decoration: none;
            transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        .home-link svg {
            width: 0.8em;
            height: 0.8em;
            margin-right: 0.45em;
            flex: none;
        }

        .home-link:focus-visible {
            color: #121212;
            background: #dadada;
            border-color: #dadada;
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        .background-wrapper {
            position: absolute;
            z-index: -1;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .visual {
            --rotation: 45deg;
            position: absolute;
            top: 50%;
            left: 50%;
            margin: 0;
            color: #282828;
            font-size: 60vmax;
            font-weight: 700;
            line-height: 0.75;
            letter-spacing: 0.025em;
            transform: translate(-50%, -50%) rotate(calc(0deg - var(--rotation)));
            transform-origin: center;
            transition: color 750ms ease-in-out, transform 300ms ease-out;
            white-space: nowrap;
        }

        .message {
            z-index: 1;
            grid-row: 3;
            width: min(70vw, 30rem);
            margin: 0;
            align-self: end;
            justify-self: end;
            color: #dadada;
            font-size: clamp(1.5rem, 1rem + 3vmin, 3.25rem);
            line-height: 1.2;
            text-align: right;
            text-shadow: -1px -1px 0 #121212, 1px 1px 0 #121212,
                -1px 1px 0 #121212, 1px -1px 0 #121212;
            text-wrap: balance;
        }

        .message p {
            margin: 0;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (hover: hover) {
            .home-link:hover {
                color: #121212;
                background: #dadada;
                border-color: #dadada;
            }

            .home-link:hover ~ .background-wrapper .visual {
                color: #dadada;
            }
        }

        .home-link:focus-visible ~ .background-wrapper .visual {
            color: #dadada;
        }

        @media (max-height: 28rem) {
            .error-page {
                gap: 0.75rem;
            }

            .message {
                font-size: clamp(1.25rem, 1rem + 2vmin, 2rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .home-link,
            .visual {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="error-page">
        <a class="home-link" href="https://wangyifang.com/" aria-label="返回 WANGYIFANG.COM 首页">
            <svg viewBox="0 0 10 10" aria-hidden="true" focusable="false">
                <polyline fill="none" stroke="currentColor" stroke-width="1.4" points="8,1 2,5 8,9" />
            </svg>
            <span>WANGYIFANG.COM</span>
        </a>

        <div class="background-wrapper" aria-hidden="true">
            <div class="visual" id="visual">404</div>
        </div>

        <div class="message">
            <h1 class="visually-hidden">404：页面未找到</h1>
            <p>你访问的这个页面已经不见了。</p>
        </div>
    </main>

    <script>
        (() => {
            const visual = document.getElementById("visual");
            let frameId;

            const updateRotation = () => {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const rotation = width > 0 ? 45 * (height / width) : 45;

                visual.style.setProperty("--rotation", `${Math.min(80, Math.max(20, rotation))}deg`);
                frameId = undefined;
            };

            const queueRotationUpdate = () => {
                if (frameId === undefined) {
                    frameId = window.requestAnimationFrame(updateRotation);
                }
            };

            queueRotationUpdate();
            window.addEventListener("resize", queueRotationUpdate, { passive: true });

            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", queueRotationUpdate, { passive: true });
            }
        })();
    </script>
</body>

</html>
